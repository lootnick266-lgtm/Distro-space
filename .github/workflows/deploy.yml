name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Collect Go dependency licenses
        run: |
          go install github.com/google/go-licenses@latest
          mkdir -p LICENSEfolder
          go-licenses report ./VKAlerts > LICENSEfolder/licenses.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push vkbot
        run: |
          docker build -t ghcr.io/${{ secrets.CR_USER }}/vkbot:latest .
          docker push ghcr.io/${{ secrets.CR_USER }}/vkbot:latest

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 22
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/localhost
            docker compose pull
            docker compose up -d
