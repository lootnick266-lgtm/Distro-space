name: Deploy

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Update managed VPS with Ansible
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Decide whether the checked commit needs deployment
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          sha = os.environ['RELEASE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid release SHA')
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/git/ref/heads/main',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=20) as response:
              current = json.load(response)['object']['sha']
          deploy = current == sha
          skip_reason = 'outdated checked commit'
          if deploy:
              try:
                  commit_request = urllib.request.Request(
                      'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/commits/' + sha,
                      headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                               'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(commit_request, timeout=20) as response:
                      commit = json.load(response)
                  files = commit.get('files')
                  if isinstance(files, list) and 0 < len(files) < 300:
                      changed_paths = []
                      for item in files:
                          changed_paths.append(item.get('filename', ''))
                          previous = item.get('previous_filename')
                          if previous:
                              changed_paths.append(previous)
                      def is_documentation(path):
                          normalized = path.strip('/').lower()
                          return (normalized == 'docs' or normalized.startswith('docs/') or
                                  ('/' not in normalized and
                                   (normalized == 'readme' or normalized.startswith('readme.'))))
                      if changed_paths and all(is_documentation(path) for path in changed_paths):
                          deploy = False
                          skip_reason = 'README/docs-only commit'
              except Exception as error:
                  print('Could not classify docs-only changes; deployment will proceed: ' + str(error))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('deploy=' + str(deploy).lower() + '\n')
          if deploy:
              print('Deploying checked commit ' + sha)
          else:
              print('Skipping ' + skip_reason + '.')
          PY

      - uses: actions/checkout@v4
        if: steps.release.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.release.outputs.deploy == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-checks.txt

      - name: Install the same Ansible version as in Checks
        if: steps.release.outputs.deploy == 'true'
        run: python3 -m pip install -r scripts/requirements-checks.txt

      - name: Prepare temporary deployment inputs
        if: steps.release.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || 'root' }}
          SITE_HOST: ${{ vars.SITE_HOST }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          from pathlib import Path
          import re
          import shlex
          import subprocess
          import yaml
          for name in ['VPS_HOST', 'DEPLOY_SSH_KEY', 'DEPLOY_KNOWN_HOSTS', 'GHCR_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID', 'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ZONE_ID']:
              if not os.environ.get(name, '').strip():
                  raise SystemExit('Missing GitHub variable or secret: ' + name)
          if not re.fullmatch(r'[A-Fa-f0-9]{32}', os.environ['CLOUDFLARE_ZONE_ID'].strip()):
              raise SystemExit('CLOUDFLARE_ZONE_ID must be a 32-character Cloudflare Zone ID.')
          host = str(ipaddress.ip_address(os.environ['VPS_HOST'].strip()))
          if not ipaddress.ip_address(host).is_global:
              raise SystemExit('VPS_HOST must be the public VPS IP.')
          user = os.environ['VPS_USER']
          if not re.fullmatch(r'[a-z_][a-z0-9_-]*', user):
              raise SystemExit('Invalid VPS_USER')
          namespace = os.environ['REGISTRY_OWNER'].lower()
          site = os.environ.get('SITE_HOST', '').strip() or host
          try:
              ipaddress.ip_address(site)
              domain = False
          except ValueError:
              domain = True
          directory = Path(os.environ['RUNNER_TEMP']) / 'distro-deploy'
          directory.mkdir(mode=0o700)
          def save(name, value):
              path = directory / name
              path.write_text(value)
              path.chmod(0o600)
              return path
          key = save('deploy.key', os.environ['DEPLOY_SSH_KEY'].replace('\r\n', '\n').rstrip() + '\n')
          known = save('known_hosts', os.environ['DEPLOY_KNOWN_HOSTS'].replace('\r\n', '\n').strip() + '\n')
          result = subprocess.run(
              ['ssh-keygen', '-F', host, '-f', str(known)], capture_output=True)
          if result.returncode:
              raise SystemExit('DEPLOY_KNOWN_HOSTS has no trusted key for VPS_HOST.')
          ssh_args = ' '.join([
              '-o BatchMode=yes', '-o PasswordAuthentication=no',
              '-o KbdInteractiveAuthentication=no', '-o StrictHostKeyChecking=yes',
              '-o IdentitiesOnly=yes', '-o ForwardAgent=no',
              '-o UserKnownHostsFile=' + shlex.quote(str(known))])
          variables = dict(
              ansible_host=host, ansible_user=user,
              ansible_python_interpreter='/usr/bin/python3',
              ansible_ssh_private_key_file=str(key), ansible_ssh_common_args=ssh_args,
              distro_site_host=site, distro_ingress_host_enabled=domain,
              distro_registry_auth_enabled=True, distro_build_images=True,
              distro_image_namespace=namespace,
              distro_telegram_enabled=True,
              distro_db_snapshot='',
              distro_cloudflare_zone_id=os.environ['CLOUDFLARE_ZONE_ID'].strip())
          inventory = {'all': {'children': {'distro': {'hosts': {'vps': variables}}}}}
          save('inventory.yml', yaml.safe_dump(inventory))
          save('deployment-secrets.yml', yaml.safe_dump(dict(
              distro_registry_username=namespace,
              distro_registry_token=os.environ['GHCR_TOKEN'],
              distro_telegram_bot_token=os.environ['TELEGRAM_BOT_TOKEN'],
              distro_telegram_chat_id=os.environ['TELEGRAM_CHAT_ID'],
              distro_cloudflare_api_token=os.environ['CLOUDFLARE_API_TOKEN'].strip())))
          print('Temporary SSH and deployment inputs prepared; database credentials stay on the VPS.')
          PY

      - name: Verify SSH key authentication
        if: steps.release.outputs.deploy == 'true'
        working-directory: ansible
        run: ansible distro -i "$RUNNER_TEMP/distro-deploy/inventory.yml" -m ansible.builtin.ping

      - name: Update the existing VPS and run health checks
        if: steps.release.outputs.deploy == 'true'
        working-directory: ansible
        run: |
          ansible-playbook deploy.yml             -i "$RUNNER_TEMP/distro-deploy/inventory.yml"             -e "@$RUNNER_TEMP/distro-deploy/deployment-secrets.yml"

      - name: Remove temporary deployment credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          base = Path(os.environ['RUNNER_TEMP']).resolve()
          directory = base / 'distro-deploy'
          if directory.exists():
              if directory.is_symlink() or directory.resolve().parent != base:
                  raise SystemExit('Unexpected temporary credential path.')
              shutil.rmtree(directory)
          PY
