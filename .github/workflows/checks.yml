name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vps_host:
        description: "Public VPS IP for a read-only connectivity test; leave empty to run Checks"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.vps_host == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PHP_CHECK_IMAGE: php:8.2.33-cli
      PROMETHEUS_CHECK_IMAGE: quay.io/prometheus/prometheus:v3.15.1-distroless
      ALERTMANAGER_CHECK_IMAGE: quay.io/prometheus/alertmanager:v0.34.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.5'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: VKAlerts/go.sum
      - name: Install YAML parser
        run: python3 -m pip install -r scripts/requirements-checks.txt
      - name: Prepare Go dependencies
        working-directory: VKAlerts
        run: go mod download
      - name: Prepare check images
        run: |
          docker pull "$PHP_CHECK_IMAGE"
          docker pull "$PROMETHEUS_CHECK_IMAGE"
          docker pull "$ALERTMANAGER_CHECK_IMAGE"
      - name: Run the same checks as locally
        run: bash scripts/check.sh


  connectivity:
    name: GitHub runner to VPS (read-only)
    if: github.event_name == 'workflow_dispatch' && inputs.vps_host != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    env:
      VPS_HOST: ${{ inputs.vps_host }}
    steps:
      - name: Check SSH reachability and registry HTTPS without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          import socket
          import urllib.error
          import urllib.request

          host = str(ipaddress.ip_address(os.environ['VPS_HOST'].strip()))
          if not ipaddress.ip_address(host).is_global:
              raise SystemExit('Enter the public IP of your VPS.')
          print('Testing VPS SSH port 22; no login will be attempted.', flush=True)
          with socket.create_connection((host, 22), timeout=10) as connection:
              connection.settimeout(10)
              with connection.makefile('rb') as stream:
                  banner = stream.readline(512)
              if not banner.startswith(b'SSH-2.0-'):
                  raise SystemExit('No valid SSH server banner received.')
              print('PASS VPS SSH banner:', banner.decode('ascii', errors='replace').strip())

          checks = [
              ('https://api.github.com/zen', {200}),
              ('https://ghcr.io/v2/', {200, 401}),
          ]
          for url, expected in checks:
              request = urllib.request.Request(
                  url, method='GET', headers={'User-Agent': 'distro-connectivity-check'})
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
              if status not in expected:
                  raise SystemExit('Unexpected HTTP status for ' + url + ': ' + str(status))
              print('PASS HTTPS:', url, 'HTTP', status)
          print('Network checks passed. SSH authentication and deployment were not tested.')
          PY
