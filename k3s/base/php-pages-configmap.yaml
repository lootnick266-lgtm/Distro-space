    elseif ($r['status'] === 'in_progress') {\r\n        $inProgressRequests++;\r\n
    \   } elseif ($r['status'] === 'completed') {\r\n        $completedRequests++;\r\n
    \   }\r\n}\r\n\r\n// Диалоги по дням (последние 7 дней)\r\n$dialogsByDay = $bot->getDialogsByDay(7);\r\n$dialogDates
    = [];\r\n$dialogCounts = [];\r\n\r\nif ($dialogsByDay) {\r\n    foreach ($dialogsByDay
    as $day) {\r\n        $dialogDates[] = $day['date'];\r\n        $dialogCounts[]
    = $day['count'];\r\n    }\r\n}\r\n\r\n// Самые активные пользователи (по заявкам)\r\n$userActivity
