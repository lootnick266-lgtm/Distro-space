apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: distro-space
  namespace: distro-space
spec:
  ingressClassName: traefik
  rules:
    - host: distro.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80