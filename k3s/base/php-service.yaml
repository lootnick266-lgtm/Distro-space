apiVersion: apps/v1
kind: Deployment
metadata:
  name: vkbot
  namespace: distro-space
  labels:
    app: vkbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vkbot
  template:
    metadata:
      labels:
        app: vkbot
    spec:
      containers:
        - name: vkbot
          image: distro-vkbot:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          envFrom:
            - secretRef:
                name: vkbot-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi