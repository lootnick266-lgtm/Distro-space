apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: distro-space-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
  - name: distro-space.alerts
    rules:
    - alert: SiteDown
      expr: probe_success{job="distro-http"} == 0
      for: 1m
      labels:
        severity: critical
        notify: vk
      annotations:
        summary: Сайт недоступен
        description: 'HTTP probe failed: {{ $labels.instance }}'
    - alert: MySQLDown
      expr: mysql_up{job="mysql"} == 0
      for: 1m
      labels:
        severity: critical
        notify: vk
      annotations:
        summary: MySQL unavailable
        description: 'MySQL Exporter cannot connect: {{ $labels.instance }}'
    - alert: MonitoringTargetDown
      expr: up{job=~"nginx|mysql|blackbox-exporter"} == 0
      for: 2m
      labels:
        severity: critical
        notify: vk
      annotations:
        summary: Metrics target unavailable
        description: '{{ $labels.job }} / {{ $labels.instance }}'
    - alert: ContainerDown
      expr: (kube_pod_container_status_ready{namespace="distro-space",container!="vkbot"}
        == 0) and on(namespace,pod) (kube_pod_status_phase{namespace="distro-space",phase=~"Pending|Running"}
        == 1)
      for: 5m
      labels:
        severity: critical
        notify: vk
      annotations:
        summary: Контейнер {{ $labels.container }} остановлен
        description: '{{ $labels.namespace }}/{{ $labels.pod }}: {{ $labels.container
          }} is not ready'
    - alert: ContainerRestarting
      expr: increase(kube_pod_container_status_restarts_total{namespace="distro-space",container!="vkbot"}[10m])
        > 2
      for: 2m
      labels:
        severity: warning
        notify: vk
      annotations:
        summary: Контейнер перезапускается
        description: '{{ $labels.namespace }}/{{ $labels.pod }}: {{ $labels.container
          }} restarted more than twice in 10 minutes'
