apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    logs:
      access:
        enabled: true
        format: json
        filters:
          statuscodes: "401-401"
        fields:
          defaultmode: keep
          headers:
            defaultmode: drop
            names:
              CF-Connecting-IP: keep
