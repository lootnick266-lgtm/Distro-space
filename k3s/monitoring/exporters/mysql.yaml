apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-exporter
  template:
    metadata:
      labels:
        app: mysql-exporter
    spec:
      containers:
      - name: mysql-exporter
        image: docker.io/prom/mysqld-exporter:latest
        imagePullPolicy: Never
        args:
        - --config.my-cnf=/etc/mysql-exporter/.my.cnf
        - --mysqld.address=db.distro-space.svc.cluster.local:3306
        ports:
        - name: metrics
          containerPort: 9104
        volumeMounts:
        - name: credentials
          mountPath: /etc/mysql-exporter
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
      - name: credentials
        secret:
          secretName: mysql-exporter-credentials
          defaultMode: 292
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter
  namespace: monitoring
  labels:
    app: mysql-exporter
    job: mysql
spec:
  selector:
    app: mysql-exporter
  ports:
  - name: metrics
    port: 9104
    targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mysql-exporter
  namespace: monitoring
  labels:
    release: kps
spec:
  jobLabel: job
  selector:
    matchLabels:
      app: mysql-exporter
  endpoints:
  - port: metrics
    interval: 30s
