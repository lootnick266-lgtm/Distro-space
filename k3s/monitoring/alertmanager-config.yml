global:
  resolve_timeout: 5m
route:
  group_by:
  - alertname
  - namespace
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'
  routes:
  - receiver: telegram
    matchers:
    - notify="telegram"
  - receiver: telegram
    matchers:
    - severity=~"warning|critical"
receivers:
- name: 'null'
- name: telegram
  webhook_configs:
  - url: http://telegrambot.distro-space.svc.cluster.local:8080/webhook
    send_resolved: true
