server {
  listen 80;
  server_name _;
  server_tokens off;
  root /var/www/localhost/public/Distro-space;
  index indexbase.html;
  location /nginx_status {
    stub_status;
    allow 127.0.0.1;
    allow 10.42.0.0/16;
    deny all;
    access_log off;
  }
  location ^~ /TechSupport/ {
    alias /var/www/localhost/public/TechSupport/;
    index index.html;
    try_files $uri $uri/ =404;
  }
  location ~ /\. { deny all; }
  location ~ ^/src/controlls/php/(?:test|socket-client|socket-server)\.php$ { return 404; }
  location ~ \.php$ {
    # Expose application endpoints only, never arbitrary PHP paths.
    if ($uri !~ "^/src/(controlls/php|exports|import)/[a-z_]+\\.php$") { return 404; }
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/localhost$fastcgi_script_name;
  }
  location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control public;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ @php; }
  location @php {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/localhost/src/controlls/php/index.php;
  }
}
