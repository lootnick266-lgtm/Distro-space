---
- name: Copy existing monitoring values and application alert rules
  ansible.builtin.copy:
    src: "{{ distro_repo_root }}/k3s/monitoring/{{ item }}"
    dest: "{{ distro_remote_root }}/monitoring/{{ item }}"
    mode: '0600'
  loop: [kube-prometheus.yaml, distro-space-alerts.yaml, grafana-admin-session.yaml, traefik-accesslog.yaml]

- name: Fetch the official Cloudflare IPv4 ranges
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v4
    method: GET
    return_content: true
    status_code: 200
  register: distro_cloudflare_ipv4
  changed_when: false

- name: Fetch the official Cloudflare IPv6 ranges
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-v6
    method: GET
    return_content: true
    status_code: 200
  register: distro_cloudflare_ipv6
  changed_when: false

- name: Combine and validate Cloudflare source ranges
  ansible.builtin.set_fact:
    distro_cloudflare_ip_ranges: "{{ (distro_cloudflare_ipv4.content.splitlines() + distro_cloudflare_ipv6.content.splitlines()) | map('trim') | reject('equalto', '') | list }}"

- name: Require valid IPv4 and IPv6 Cloudflare source ranges
  ansible.builtin.assert:
    that:
      - distro_cloudflare_ipv4.content.splitlines() | length > 0
      - distro_cloudflare_ipv6.content.splitlines() | length > 0
      - distro_cloudflare_ip_ranges | select('match', '^[0-9A-Fa-f:.]+/[0-9]{1,3}$') | list | length == distro_cloudflare_ip_ranges | length
    fail_msg: "Cloudflare source ranges could not be fetched or validated."

- name: Render the Grafana Cloudflare source allowlist
  ansible.builtin.template:
    src: grafana-cloudflare-only.yaml.j2
    dest: "{{ distro_remote_root }}/monitoring/grafana-cloudflare-only.yaml"
    mode: '0600'

- name: Apply the Cloudflare-only Grafana ingress guard
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['apply', '-f', distro_remote_root + '/monitoring/grafana-cloudflare-only.yaml'] }}"
  register: distro_grafana_cloudflare_middleware
  changed_when: "'created' in distro_grafana_cloudflare_middleware.stdout or 'configured' in distro_grafana_cloudflare_middleware.stdout"

- name: Apply the admin-session gate before publishing Grafana ingress
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['apply', '-f', distro_remote_root + '/monitoring/grafana-admin-session.yaml'] }}"
  register: distro_grafana_auth_middleware
  changed_when: "'created' in distro_grafana_auth_middleware.stdout or 'configured' in distro_grafana_auth_middleware.stdout"

- name: Enable JSON Traefik access logs with the Cloudflare client IP field
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['apply', '-f', distro_remote_root + '/monitoring/traefik-accesslog.yaml'] }}"
  register: distro_traefik_accesslog_config
  changed_when: "'created' in distro_traefik_accesslog_config.stdout or 'configured' in distro_traefik_accesslog_config.stdout"

- name: Wait for Traefik to load the access log configuration
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['-n', 'kube-system', 'get', 'deployment', 'traefik', '-o', 'jsonpath={.spec.template.spec.containers[0].args}'] }}"
  register: distro_traefik_args
  changed_when: false
  retries: 30
  delay: 5
  until: >-
    '--accesslog=true' in distro_traefik_args.stdout and
    '--accesslog.format=json' in distro_traefik_args.stdout and
    '--accesslog.filters.statuscodes=401-401' in distro_traefik_args.stdout and
    '--accesslog.fields.headers.defaultmode=drop' in distro_traefik_args.stdout and
    '--accesslog.fields.headers.names.CF-Connecting-IP=keep' in distro_traefik_args.stdout

- name: Wait for Traefik rollout after access logging changes
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['-n', 'kube-system', 'rollout', 'status', 'deployment/traefik', '--timeout=300s'] }}"
  changed_when: false

- name: Render registry deployment overrides
  ansible.builtin.template:
    src: monitoring-values.yaml.j2
    dest: "{{ distro_remote_root }}/monitoring/overrides.yaml"
    mode: '0600'
  register: distro_monitoring_overrides

- name: Read inputs used to detect managed Helm changes
  ansible.builtin.stat:
    path: "{{ distro_remote_root }}/monitoring/{{ item }}"
    checksum_algorithm: sha256
  loop: [kube-prometheus.yaml, overrides.yaml]
  register: distro_values_checksums

- name: Compute monitoring deployment revision
  ansible.builtin.set_fact:
    distro_monitoring_fingerprint: "{{ ([distro_chart_version] + (distro_values_checksums.results | map(attribute='stat.checksum') | list)) | to_json | hash('sha256') }}"

- name: Read previous managed monitoring revision
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['-n', 'monitoring', 'get', 'configmap', 'distro-monitoring-state', '--ignore-not-found', '-o', 'jsonpath={.data.fingerprint}'] }}"
  register: distro_previous_monitoring
  changed_when: false

- name: Inspect Helm release state
  ansible.builtin.command:
    argv: [helm, status, kps, --namespace, monitoring, --kubeconfig, "{{ distro_kubeconfig }}", --output, json]
  register: distro_helm_status
  failed_when: false
  changed_when: false

- name: Update monitoring only if its managed inputs changed or release is not deployed
  when: >-
    distro_previous_monitoring.stdout != distro_monitoring_fingerprint or
    distro_helm_status.rc != 0 or
    (distro_helm_status.stdout | from_json).info.status != 'deployed'
  block:
    - name: Configure the official chart repository
      ansible.builtin.command:
        argv: [helm, repo, add, prometheus-community, "{{ distro_chart_repository }}", --force-update]
      changed_when: false

    - name: Refresh chart index
      ansible.builtin.command:
        argv: [helm, repo, update, prometheus-community]
      changed_when: false

    - name: Install pinned monitoring chart
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - kps
          - prometheus-community/kube-prometheus-stack
          - --version
          - "{{ distro_chart_version }}"
          - --namespace
          - monitoring
          - --kubeconfig
          - "{{ distro_kubeconfig }}"
          - --values
          - "{{ distro_remote_root }}/monitoring/kube-prometheus.yaml"
          - --values
          - "{{ distro_remote_root }}/monitoring/overrides.yaml"
          - --wait
          - --timeout
          - 10m
          - --history-max
          - '5'
      register: distro_helm_install
      changed_when: true

    - name: Record successful monitoring revision
      ansible.builtin.command:
        argv: "{{ distro_kubectl + ['apply', '-f', '-'] }}"
        stdin: "{{ {'apiVersion': 'v1', 'kind': 'ConfigMap', 'metadata': {'name': 'distro-monitoring-state', 'namespace': 'monitoring'}, 'data': {'fingerprint': distro_monitoring_fingerprint}} | to_json }}"
      changed_when: true

- name: Render exporter manifests using registry images
  ansible.builtin.template:
    src: exporters.yaml.j2
    dest: "{{ distro_remote_root }}/monitoring/exporters.yaml"
    mode: '0600'

- name: Apply exporters, probes and application alerts
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['apply', '-f', distro_remote_root + '/monitoring/exporters.yaml', '-f', distro_remote_root + '/monitoring/distro-space-alerts.yaml'] }}"
  register: distro_exporters
  changed_when: "'created' in distro_exporters.stdout or 'configured' in distro_exporters.stdout"

- name: Wait for exporters
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['-n', 'monitoring', 'rollout', 'status', 'deployment/' + item, '--timeout=300s'] }}"
  loop: [nginx-exporter, mysql-exporter, blackbox-exporter]
  changed_when: false
