---
- name: Create only the application and monitoring namespaces
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['apply', '-f', '-'] }}"
    stdin: "{{ {'apiVersion': 'v1', 'kind': 'Namespace', 'metadata': {'name': item, 'labels': {'app.kubernetes.io/managed-by': 'Ansible'}}} | to_json }}"
  loop: [distro-space, monitoring]
  register: distro_namespaces
  changed_when: "'created' in distro_namespaces.stdout or 'configured' in distro_namespaces.stdout"

- name: Fingerprint immutable initial database and Grafana credentials
  ansible.builtin.set_fact:
    distro_credentials_hash: "{{ [distro_mysql_root_password, distro_mysql_app_password, distro_mysql_exporter_password, distro_grafana_admin_password, distro_db_name, distro_db_user] | to_json | hash('sha256') }}"
  no_log: true

- name: Read credential fingerprint only, never secret values
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['-n', 'distro-space', 'get', 'secret', 'mysql-secret', '--ignore-not-found', '-o', 'jsonpath={.metadata.name}|{.metadata.annotations.distro-credentials-hash}'] }}"
  register: distro_existing_fingerprint
  changed_when: false
  no_log: true

- name: Refuse implicit credential or database identity rotation
  ansible.builtin.assert:
    that:
      - distro_existing_fingerprint.stdout in ['', 'mysql-secret|' + distro_credentials_hash]
    fail_msg: "Initial credentials changed or are unmanaged. Rotate passwords with a separate reviewed procedure."
  no_log: true

- name: Create initial application secrets via stdin only
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['apply', '-f', '-'] }}"
    stdin: "{{ lookup('template', 'credentials.yaml.j2') }}"
  register: distro_secrets
  changed_when: "'created' in distro_secrets.stdout or 'configured' in distro_secrets.stdout"
  no_log: true
  diff: false

- name: Create initial monitoring secrets via stdin only
  ansible.builtin.command:
    argv: "{{ distro_kubectl + ['apply', '-f', '-'] }}"
    stdin: "{{ lookup('template', 'monitoring-secrets.yaml.j2') }}"
  register: distro_monitoring_secrets
  changed_when: "'created' in distro_monitoring_secrets.stdout or 'configured' in distro_monitoring_secrets.stdout"
  no_log: true
  diff: false
