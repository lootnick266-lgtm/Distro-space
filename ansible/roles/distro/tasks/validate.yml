---
- name: Allocate a local temporary rendering directory
  ansible.builtin.tempfile:
    state: directory
    prefix: distro-ansible-checks-
  register: distro_validation_dir

- name: Check template outputs without deployment
  block:
    - name: Load non-secret base configuration
      ansible.builtin.set_fact:
        distro_base_config: "{{ lookup('file', distro_repo_root + '/k3s/base/kustomization.yaml') | from_yaml }}"

    - name: Copy only listed base manifests to the local temporary directory
      ansible.builtin.copy:
        src: "{{ distro_repo_root }}/k3s/base/{{ item }}"
        dest: "{{ distro_validation_dir.path }}/{{ item }}"
        mode: '0600'
      loop: "{{ distro_base_config.resources }}"

    - name: Validate storage, optional Telegram bot and private registry modes
      ansible.builtin.include_tasks: validate_case.yml
      loop:
        - {telegram: false, persistence: false, registry: false, host: true, migration: false}
        - {telegram: true, persistence: true, registry: true, host: true, migration: false}
        - {telegram: false, persistence: false, registry: true, host: false, migration: true}
      loop_control:
        loop_var: distro_validation_case
      vars:
        distro_ingress_host_enabled: "{{ distro_validation_case.host }}"
        distro_db_migration_pending: "{{ distro_validation_case.migration }}"
        distro_telegram_enabled: "{{ distro_validation_case.telegram }}"
        distro_monitoring_persistence: "{{ distro_validation_case.persistence }}"
        distro_registry_auth_enabled: "{{ distro_validation_case.registry }}"
  always:
    - name: Remove local fixture manifests including dummy credentials
      ansible.builtin.file:
        path: "{{ distro_validation_dir.path }}"
        state: absent
