---
- name: Require supported controller and single Ubuntu amd64 target
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.20', '>=')
      - groups['distro'] | length == 1
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version is version('22.04', '>=')
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.service_mgr == 'systemd'
      - ansible_facts.memtotal_mb >= 3800
      - ansible_facts.swaptotal_mb == 0
      - ansible_host | default(inventory_hostname) not in distro_protected_addresses
      - distro_node_ip not in distro_protected_addresses
      - distro_remote_root == '/opt/distro-space'
      - distro_telegram_enabled is boolean
      - distro_registry_auth_enabled is boolean
      - distro_monitoring_persistence is boolean
    fail_msg: "Use one NEW Ubuntu amd64 VM (4+ GiB, swap off). The source VM is protected."

- name: Require explicit domain and registry image references
  ansible.builtin.assert:
    that:
      - distro_site_host is match('^[a-zA-Z0-9][a-zA-Z0-9.-]+$')
      - distro_site_host not in ['distro.example.com', 'distro.local']
      - distro_db_name is match('^[a-zA-Z][a-zA-Z0-9_]{0,63}$')
      - distro_db_user is match('^[a-zA-Z][a-zA-Z0-9_]{0,31}$')
      - distro_nginx_image is match('^[a-z0-9.-]+/[^ ]+[:@][^ ]+$')
      - distro_php_image is match('^[a-z0-9.-]+/[^ ]+[:@][^ ]+$')
      - "'REPLACE_ME' not in distro_nginx_image + distro_php_image"
      - "':latest' not in distro_nginx_image + distro_php_image"
      - not distro_telegram_enabled or distro_telegrambot_image is match('^[a-z0-9.-]+/[^ ]+[:@][^ ]+$')
      - not distro_telegram_enabled or 'REPLACE_ME' not in distro_telegrambot_image
      - not distro_telegram_enabled or ':latest' not in distro_telegrambot_image
    fail_msg: "Set a real host and published versioned registry images in your private inventory."

- name: Require new external credentials without printing them
  ansible.builtin.assert:
    that:
      - distro_mysql_root_password is match('^[A-Za-z0-9_-]{24,128}$')
      - distro_mysql_app_password is match('^[A-Za-z0-9_-]{24,128}$')
      - distro_mysql_exporter_password is match('^[A-Za-z0-9_-]{24,128}$')
      - '[distro_mysql_root_password, distro_mysql_app_password, distro_mysql_exporter_password] | unique | list | length == 3'
      - distro_grafana_admin_password | length >= 24
      - not distro_telegram_enabled or distro_telegram_bot_token | length > 0
      - not distro_telegram_enabled or distro_telegram_chat_id | length > 0
    fail_msg: "Provide new credentials via an external encrypted Vault file. MySQL passwords: 24+ random URL-safe characters."
  no_log: true
  diff: false
  when: not distro_update_only



- name: Require Cloudflare credentials for Grafana abuse protection
  ansible.builtin.assert:
    that:
      - distro_cloudflare_api_token | length > 0
      - distro_cloudflare_zone_id is match('^[A-Fa-f0-9]{32}$')
    fail_msg: "Provide a scoped Cloudflare Zone Firewall Services Edit token and zone ID."
  no_log: true
  diff: false
  when: distro_update_only

- name: Require Telegram credentials for an enabled update-only deployment
  ansible.builtin.assert:
    that:
      - distro_telegram_bot_token | length > 0
      - distro_telegram_chat_id | length > 0
    fail_msg: "Telegram is enabled but its token or chat ID is missing."
  no_log: true
  diff: false
  when: distro_update_only and distro_telegram_enabled

- name: Require registry credentials for private image access
  ansible.builtin.assert:
    that:
      - not distro_registry_auth_enabled or distro_registry_username | length > 0
      - not distro_registry_auth_enabled or distro_registry_token | length > 0
  no_log: true

- name: Inspect ownership marker
  ansible.builtin.stat:
    path: "{{ distro_remote_root }}/ansible-managed"
  register: distro_marker

- name: Inspect existing k3s installation without reading credentials
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s
  register: distro_existing_k3s

- name: Refuse adoption of an unmanaged cluster
  ansible.builtin.assert:
    that:
      - not distro_existing_k3s.stat.exists or distro_marker.stat.exists
    fail_msg: "Existing unmanaged k3s detected. This playbook only bootstraps a new dedicated host."


- name: Refuse CI provisioning or database restore
  ansible.builtin.assert:
    that:
      - distro_marker.stat.exists
      - distro_existing_k3s.stat.exists
      - distro_db_snapshot | length == 0
      - distro_registry_auth_enabled
    fail_msg: "CI requires an existing managed VPS and must not receive a database snapshot."
  when: distro_update_only
