---
- name: Build and publish only application images whose inputs changed
  when: distro_build_images
  block:
    - name: Validate the content-addressed image registry inputs
      ansible.builtin.assert:
        that:
          - distro_image_namespace is match('^[a-z0-9][a-z0-9-]*$')
          - distro_registry_server is match('^[a-z0-9.-]+(:[0-9]+)?$')
          - distro_registry_auth_enabled
        fail_msg: "Content-addressed builds require a registry namespace and authentication."

    - name: Allocate a clean build context on the controller
      ansible.builtin.tempfile:
        state: directory
        prefix: distro-vps-context-
      delegate_to: localhost
      become: false
      register: distro_build_context

    - name: Prepare explicit source allowlist and per-image fingerprints
      ansible.builtin.command:
        argv: "{{ ['python3', distro_repo_root + '/scripts/prepare-build-context.py', '--output', distro_build_context.path] + (['--include-telegram'] if distro_telegram_enabled else []) }}"
      delegate_to: localhost
      become: false
      register: distro_context_result
      changed_when: false

    - name: Find README files in the prepared deployment context
      ansible.builtin.find:
        paths: "{{ distro_build_context.path }}"
        recurse: true
        file_type: file
        patterns: ['README*', 'readme*']
      delegate_to: localhost
      become: false
      register: distro_context_readmes

    - name: Check whether documentation directory entered the deployment context
      ansible.builtin.stat:
        path: "{{ distro_build_context.path }}/docs"
      delegate_to: localhost
      become: false
      register: distro_context_docs

    - name: Refuse to transfer README or documentation to the VPS
      ansible.builtin.assert:
        that:
          - distro_context_readmes.matched | int == 0
          - not distro_context_docs.stat.exists
        fail_msg: "README and docs must stay out of the VPS deployment context."

    - name: Parse per-image content fingerprints
      ansible.builtin.set_fact:
        distro_image_fingerprints: "{{ distro_context_result.stdout | from_json }}"

    - name: Validate the per-image fingerprints
      ansible.builtin.assert:
        that:
          - distro_image_fingerprints.php is match('^[a-f0-9]{64}$')
          - distro_image_fingerprints.nginx is match('^[a-f0-9]{64}$')
          - not distro_telegram_enabled or distro_image_fingerprints.telegrambot is match('^[a-f0-9]{64}$')
        fail_msg: "The source context did not produce valid content fingerprints."

    - name: List enabled application deployments
      ansible.builtin.set_fact:
        distro_image_names: "{{ ['php', 'nginx'] + (['telegrambot'] if distro_telegram_enabled else []) }}"

    - name: Inspect currently deployed application image references
      ansible.builtin.command:
        argv: "{{ distro_kubectl + ['-n', 'distro-space', 'get', 'deployment', item, '--ignore-not-found', '-o', 'jsonpath={.spec.template.spec.containers[0].image}'] }}"
      loop: "{{ distro_image_names }}"
      register: distro_running_images
      changed_when: false

    - name: Capture currently deployed image references
      ansible.builtin.set_fact:
        distro_current_image_refs: "{{ dict(distro_running_images.results | map(attribute='item') | zip(distro_running_images.results | map(attribute='stdout') | map('trim'))) }}"

    - name: Select desired PHP and Nginx images from their content fingerprints
      ansible.builtin.set_fact:
        distro_php_image: "{{ distro_registry_server + '/' + distro_image_namespace + '/distro-php:src-' + distro_image_fingerprints.php }}"
        distro_nginx_image: "{{ distro_registry_server + '/' + distro_image_namespace + '/distro-nginx:src-' + distro_image_fingerprints.nginx }}"

    - name: Select desired Telegram image from its content fingerprint
      ansible.builtin.set_fact:
        distro_telegrambot_image: "{{ distro_registry_server + '/' + distro_image_namespace + '/distro-telegrambot:src-' + distro_image_fingerprints.telegrambot }}"
      when: distro_telegram_enabled

    - name: Build the desired image list
      ansible.builtin.set_fact:
        distro_image_targets: >-
          {{
            [
              {'name': 'php', 'package': 'distro-php', 'image': distro_php_image},
              {'name': 'nginx', 'package': 'distro-nginx', 'image': distro_nginx_image}
            ] +
            ([{'name': 'telegrambot', 'package': 'distro-telegrambot', 'image': distro_telegrambot_image}]
             if distro_telegram_enabled else [])
          }}

    - name: Start with no image builds selected
      ansible.builtin.set_fact:
        distro_images_to_build: []

    - name: Select images whose content fingerprint differs from the deployed image
      ansible.builtin.set_fact:
        distro_images_to_build: "{{ distro_images_to_build + [item | combine({'fingerprint': distro_image_fingerprints[item.name]})] }}"
      loop: "{{ distro_image_targets }}"
      when: item.image != (distro_current_image_refs[item.name] | default(''))

    - name: Report the selected application image updates
      ansible.builtin.debug:
        msg: >-
          {{
            'No application image inputs changed; reusing current images.'
            if distro_images_to_build | length == 0 else
            'Building changed images: ' ~ (distro_images_to_build | map(attribute='name') | join(', '))
          }}

    - name: Build and publish the selected application images
      when: distro_images_to_build | length > 0
      block:
        - name: Install the daemonless image builder
          ansible.builtin.apt:
            name: buildah
            state: present

        - name: Inspect visibility of packages being updated without exposing credentials
          ansible.builtin.uri:
            url: "https://api.github.com/users/{{ distro_image_namespace }}/packages/container/{{ item.package }}"
            headers:
              Authorization: "Bearer {{ distro_registry_token }}"
              Accept: application/vnd.github+json
            status_code: [200, 404]
            timeout: 30
          loop: "{{ distro_images_to_build }}"
          register: distro_package_visibility
          no_log: true

        - name: Refuse publication into an existing public package
          ansible.builtin.assert:
            that:
              - item.status == 404 or item.json.visibility == 'private'
            fail_msg: "The destination GHCR package must be private."
          loop: "{{ distro_package_visibility.results }}"
          no_log: true

        - name: Pack only the clean source directory for one SSH transfer
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - 'import sys, tarfile; archive = tarfile.open(sys.argv[1] + ".tar.gz", "w:gz"); archive.add(sys.argv[1], arcname="."); archive.close()'
              - "{{ distro_build_context.path }}"
          delegate_to: localhost
          become: false
          changed_when: false

        - name: Transfer the clean source archive
          ansible.builtin.copy:
            src: "{{ distro_build_context.path }}.tar.gz"
            dest: "{{ distro_remote_root }}/build-context.tar.gz"
            mode: '0600'

        - name: Remove only the disposable previous source context
          ansible.builtin.file:
            path: "{{ distro_remote_root }}/build-context"
            state: absent

        - name: Create the disposable source context
          ansible.builtin.file:
            path: "{{ distro_remote_root }}/build-context"
            state: directory
            mode: '0700'

        - name: Extract the clean source archive
          ansible.builtin.unarchive:
            src: "{{ distro_remote_root }}/build-context.tar.gz"
            dest: "{{ distro_remote_root }}/build-context"
            remote_src: true

        - name: Remove the transferred source archive
          ansible.builtin.file:
            path: "{{ distro_remote_root }}/build-context.tar.gz"
            state: absent

        - name: Authenticate to the private registry without exposing the token
          ansible.builtin.command:
            argv: [buildah, login, --authfile, "{{ distro_remote_root }}/registry-auth.json",
                   --username, "{{ distro_registry_username }}", --password-stdin,
                   "{{ distro_registry_server }}"]
            stdin: "{{ distro_registry_token }}"
          no_log: true

        - name: Build only the selected versioned application images
          ansible.builtin.command:
            argv: [buildah, bud, --layers, --isolation, chroot, --format, docker,
                   --file, "{{ distro_remote_root }}/build-context/Dockerfile.{{ item.name }}",
                   --tag, "{{ item.image }}", "{{ distro_remote_root }}/build-context"]
          loop: "{{ distro_images_to_build }}"

        - name: Create temporary verification containers for changed web images
          ansible.builtin.command:
            argv: [buildah, from, --name, "distro-check-{{ item.name }}", "{{ item.image }}"]
          loop: "{{ distro_images_to_build | selectattr('name', 'in', ['php', 'nginx']) | list }}"

        - name: Verify PHP worker can read code and load required extensions
          ansible.builtin.command:
            argv:
              - buildah
              - run
              - --isolation
              - chroot
              - --user
              - www-data
              - distro-check-php
              - php
              - -r
              - 'foreach (["/var/www/localhost/src/controlls/php/config.php", "/var/www/localhost/src/controlls/php/classes/User.php"] as $p) { if (!is_readable($p)) exit(1); } foreach (["mysqli", "pdo_mysql", "mbstring", "session"] as $m) { if (!extension_loaded($m)) exit(1); }'
          changed_when: false
          when: "'php' in (distro_images_to_build | map(attribute='name') | list)"

        - name: Verify nginx worker can read the main page
          ansible.builtin.command:
            argv: [buildah, run, --isolation, chroot, --user, nginx,
                   distro-check-nginx, test, -r,
                   /var/www/localhost/public/Distro-space/indexbase.html]
          changed_when: false
          when: "'nginx' in (distro_images_to_build | map(attribute='name') | list)"

        - name: Push only the selected versioned application images
          ansible.builtin.command:
            argv: [buildah, push, --authfile, "{{ distro_remote_root }}/registry-auth.json",
                   "{{ item.image }}"]
          loop: "{{ distro_images_to_build }}"

      always:
        - name: Remove only temporary image verification containers
          ansible.builtin.command:
            argv: [buildah, rm, distro-check-php, distro-check-nginx]
          failed_when: false
          changed_when: false

        - name: Remove temporary registry login file
          ansible.builtin.file:
            path: "{{ distro_remote_root }}/registry-auth.json"
            state: absent
          no_log: true

  always:
    - name: Remove disposable VPS source context and archive
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ distro_remote_root }}/build-context"
        - "{{ distro_remote_root }}/build-context.tar.gz"

    - name: Remove only the temporary controller build context and archive
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ distro_build_context.path | default('/tmp/distro-context-not-created') }}"
        - "{{ (distro_build_context.path | default('/tmp/distro-context-not-created')) + '.tar.gz' }}"
      delegate_to: localhost
      become: false
      when: distro_build_context is defined
